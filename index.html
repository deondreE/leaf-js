<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worky</title>
  </head>
  <body>
    <canvas is="leaf-js" src="initScene" width="800" height="800" id="webgpu-canvas"> </canvas>
    <script type="module">
      window.leaf = window.leaf || {};

      window.leaf.createScene = () => ({
        name: 'Demo Scene',

        camera: {
          type: 'orthographic',
          FOV: 45,
          cameraBounds: 1.0,
          near: 0.1,
          far: 100.0,
          zoom: 1.0,
        },

        particle: {
          enabled: false,
        },

        objects: [
          {
            name: 'testMesh',
            shape: 'box',
            scale: {
              width: 20,
              height: 20,
              depth: 20,
            },
            color: { r: 255, g: 0, b: 255, a: 255 },
            rotation: { x: 0, y: 45, z: 45 },
            amount: 1,
          },
        ],

        physics: {
          enabled: false,
        },

        animations: {
          enabled: true,
          duration: 5.0,
          tracks: [
            {
              target: 'camera',
              property: 'position.z',
              keyframes: [
                { time: 0, value: 10 },
                { time: 2.5, value: 5 },
                { time: 5, value: 10 },
              ],
              loop: true,
            },
            {
              target: 'light',
              property: 'rotation.y',
              keyframes: [
                { time: 0, value: 0 },
                { time: 5, value: 6.28 },
              ],
              loop: true,
            },
          ],
        },
      });
    </script>
    <script type="module" src="/src/leaf.ts"></script>
  </body>
</html>
