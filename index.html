<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worky</title>
  </head>
  <style>
  * {
    background-color: #FFF;
  }
  </style>
  <body>
    <canvas is="leaf-js" src="initScene" width="800" height="800" id="webgpu-canvas" bgClearColor="{r:12, g:12, b:12, a:255}"> </canvas>
    <script type="module">
      window.leaf = window.leaf || {};

      window.leaf.createScene = () => ({
        name: 'Demo Scene',
        camera: {
          type: 'perspective',
          FOV: 60,
          cameraBounds: 1.0,
          near: 0.1,
          far: 2000.0,
          position: {
            x: 100,
            y: 25,
            z: 200,
          },
          zoom: 1.0,
        },
        particle: {
          enabled: false,
        },
        objects: [
          {
            name: 'testMesh',
            shape: 'sphere',
            scale: {
              width: 3,
              height: 1,
              depth: 4,
            },
            color: { r: 0, g: 0, b: 255, a: 255 },
            rotation: { x: 0, y: 45, z: 0 },
            pos: {x: 0, y: 0, z: 0, },
            amount: 1,
          }, 
          {
            name: 'testTorus',
            shape: 'torus',
            scale: {
              width: 4,
              height: 4,
              depth: 4,
            },
            color: { r: 25, g: 54, b: 54, a: 255 },
            rotation: { x: 0, y: 45,z: 45}, 
            amount: 1,
          },
          {
            name: 'testMesh1',
            shape: 'sphere',
            scale: {
              width: 12,
              height: 12,
              depth: 12,
            },
            color: { r: 25, g: 54, b: 54, a: 255 },
            rotation: { x: 0, y: 45, z: 45 },
            amount: 1,
          },
          {
            name: 'testMesh2',
            shape: 'sphere',
            scale: {
              width: 12,
              height: 12,
              depth: 12,
            },
            color: { r: 255, g: 255,   b: 0, a: 255 },
            rotation: { x: 0, y: 45, z: 45 },
            pos: {x: 4, y: 3, z: 7},
            amount: 1,
          },
          {
            name: 'hat',
            shape: 'box',
            scale: {
              width: 12,
              height: 2,
              depth: 12,
            },
            color: { r: 36, g: 25, b: 21, a: 255 },
            rotation: { x: 0, y: 45, z: 0 },
            pos: {x: 0, y: 5, z: 0},
            amount: 1,
          },          
          {
            name: 'hattop',
            shape: 'box',
            scale: {
              width: 10,
              height: 15,
              depth: 10,
            },
            color: { r: 0, g: 0, b: 0, a: 255 },
           
            rotation: { x: 0, y: 45, z: 0 },
            pos: {x: 0, y: 1.75, z: 0},
            amount: 1,
          }
        ],
        physics: {
          enabled: false,
        },
        animations: {
          enabled: true,
          duration: 5.0,
          tracks: [
            {
              target: 'camera',
              property: 'position.z',
              keyframes: [
                { time: 0, value: 10 },
                { time: 2.5, value: 5 },
                { time: 5, value: 10 },
              ],
              loop: true,
            },
            {
              target: 'light',
              property: 'rotation.y',
              keyframes: [
                { time: 0, value: 0 },
                { time: 5, value: 6.28 },
              ],
              loop: true,
            },
          ],
        }
      });
    </script>
    <script type="module" src="/src/leaf.ts"></script>
  </body>
</html>
