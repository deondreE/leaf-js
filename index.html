<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worky</title>
  </head>
  <body>
    <canvas is="leaf-js" src="initScene" width="1000" height="1000" id="webgpu-canvas"></canvas>
    <canvas is="l-profiler" width="400" height="300" target-id="webgpu-canvas"></canvas>
  </body>
  <script src="./src/profiler.ts" type="module"></script>
  <script src="./src/leaf.ts" type="module"></script>
  <script>
    function initScene() {
      let scene = {
        particle: {
          gravity: -0.0001,
          emitter: {
            startPos: {
              z: 0,
              y: 0,
              x: 0,
            },
            emissionRate: 0,
            overTimeEffects: {
              rotationOverTime: {
                z: 0,
                y: 0,
                x: 0,
              },
              velocityOverTime: {
                z: 0,
                y: 0,
                x: 0,
              },
              colorOverTime: {
                startColor: {
                  r: 0,
                  g: 0,
                  b: 0,
                  a: 0,
                },
                endColor: {
                  r: 0,
                  g: 0,
                  b: 0,
                  a: 0,
                },
              },
              sizeOverTime: {
                startSize: {
                  w: 0,
                  h: 0,
                },
                endSize: {
                  w: 0,
                  h: 0,
                },
              },
            },
            shape: 'default',
          },
          particleCount: 4_000_000,
        },
      };

      return scene;
    }
  </script>
</html>
