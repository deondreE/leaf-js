<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <canvas id="canvas" src="t.obj" is3D width="640" height="640"></canvas>
  </body>
  <!-- <script type="module" src="./src/main.ts"></script> -->
  <script lang="ts" type="module">
    import WebGPUOBJParser from './src/parsers/obj';
    import { mat4 } from 'gl-matrix';

    const canvas = document.querySelector('canvas');
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const context = canvas.getContext('webgpu');

    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format });

    const objParser = new WebGPUOBJParser(device);
    const data = await fetch('l.obj').then((data) => (data = data.text()));
    await objParser.loadOBJ(data);

    const modelMatrix = mat4.create();
    const viewMatrix = mat4.create();
    const projectionMatrix = mat4.create();
    const mvpMatrix = mat4.create();

    mat4.lookAt(viewMatrix, [0, 0, 5], [0, 0, 0], [0, 1, 0]); // Camera at (0,0,5), looking at origin
    mat4.perspective(projectionMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 100.0); // FOV = 45 degreess

    mat4.multiply(mvpMatrix, projectionMatrix, viewMatrix);
    mat4.multiply(mvpMatrix, mvpMatrix, modelMatrix);

    const uniformBuffer = device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    device.queue.writeBuffer(uniformBuffer, 0, mvpMatrix.buffer);

    const shaderModule = device.createShaderModule({
      code: `
            struct Uniforms {
              mvpMatrix: mat4x4<f32>,
            }
            @group(0) @binding(0) var<uniform> uniforms: Uniforms; 

            struct VertexInput {
                @location(0) position: vec3<f32>,
                @location(1) normal: vec3<f32>,
                @location(2) texCoord: vec2<f32>
            };

            struct VertexOutput {
                @builtin(position) Position: vec4<f32>,
                @location(0) vNormal: vec3<f32>,
            };

            @vertex
            fn vs_main(input: VertexInput) -> VertexOutput {
                var output: VertexOutput;
                output.Position = uniforms.mvpMatrix * vec4<f32>(input.position, 1.0);
                output.vNormal = input.normal;
                return output;
            }

            @fragment
            fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
                let color = vec3<f32>(0.5, 0.5, 0.5) * (input.vNormal.z * 0.5 + 0.5);
                return vec4<f32>(color, 1.0);
            }
        `,
    });

    await objParser.createPipeline(shaderModule, format, uniformBuffer);

    const commandEncoder = device.createCommandEncoder();
    const passEncoder = commandEncoder.beginRenderPass({
      colorAttachments: [
        { view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' },
      ],
    });

    objParser.render(passEncoder);
    passEncoder.end();
    device.queue.submit([commandEncoder.finish()]);
  </script>
</html>
